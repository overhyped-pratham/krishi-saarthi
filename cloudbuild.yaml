# ── Google Cloud Build Pipeline for Krishi Saarthi ML Backend on Google Cloud Run ──
steps:
  # 1. Build the container image using Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/krishi-saarthi-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/krishi-saarthi-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # 2. Push image to Google Artifact / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/krishi-saarthi-backend:$COMMIT_SHA'

  # 3. Deploy container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'krishi-saarthi-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/krishi-saarthi-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300s'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'APP_ENV=production,STORAGE_DIR=/app/storage'

images:
  - 'gcr.io/$PROJECT_ID/krishi-saarthi-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/krishi-saarthi-backend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
